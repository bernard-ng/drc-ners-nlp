baseline_experiments:
  - name: dummy
    description: Majority-class control that ignores the name sequence.
    model_type: dummy
    features: [full_name]
    model_params: {}
    tags: [control, dummy]

  - name: logistic_regression
    description: Scaled sparse character n-gram logistic regression baseline.
    model_type: logistic_regression
    features: [full_name]
    model_params:
      ngram_range: [2, 5]
      max_features: 75000
      min_df: 2
      binary: true
      C: 1.5
      max_iter: 700
      tol: 0.0001
      solver: saga
      class_weight: balanced
    tags: [baseline, linear, character]

  - name: naive_bayes
    description: Multinomial Naive Bayes over character n-gram counts.
    model_type: naive_bayes
    features: [full_name]
    model_params:
      ngram_range: [2, 5]
      max_features: 50000
      alpha: 1.0
    tags: [baseline, probabilistic, character]

  - name: position_logistic_regression
    description: Position-aware TF-IDF logistic regression with an explicit surname channel.
    model_type: position_logistic_regression
    features: [full_name]
    model_params:
      ngram_range: [2, 5]
      token_ngram_range: [2, 5]
      sequence_max_features: 60000
      token_max_features: 20000
      min_df: 2
      C: 2.0
      max_iter: 700
      tol: 0.0001
      solver: saga
      class_weight: balanced
    tags: [baseline, linear, character, position_aware]

  - name: random_forest
    description: Random forest over character TF-IDF, capped at 4,096 features.
    model_type: random_forest
    features: [full_name]
    model_params:
      ngram_range: [2, 4]
      max_features: 4096
      n_estimators: 200
      max_depth: 24
      min_samples_leaf: 2
      class_weight: balanced_subsample
      n_jobs: -1
    tags: [baseline, tree, character]

  - name: lightgbm
    description: LightGBM over character TF-IDF, capped at 4,096 features.
    model_type: lightgbm
    features: [full_name]
    model_params:
      ngram_range: [2, 4]
      max_features: 4096
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 63
      class_weight: balanced
      n_jobs: -1
    tags: [baseline, boosting, character]

  - name: xgboost
    description: XGBoost over character TF-IDF, capped at 4,096 features.
    model_type: xgboost
    features: [full_name]
    model_params:
      ngram_range: [2, 4]
      max_features: 4096
      n_estimators: 300
      max_depth: 8
      learning_rate: 0.05
      tree_method: hist
      n_jobs: -1
    tags: [baseline, boosting, character]

  - name: cnn
    description: Character-level convolutional neural network.
    model_type: cnn
    features: [full_name]
    model_params:
      max_len: 32
      embedding_dim: 64
      filters: 64
      kernel_size: 3
      dropout: 0.5
      epochs: 5
      batch_size: 256
      validation_split: 0.1
    tags: [baseline, neural, character]

  - name: lstm
    description: Bidirectional character-level LSTM sequence model.
    model_type: lstm
    features: [full_name]
    model_params:
      max_len: 32
      embedding_dim: 64
      lstm_units: 32
      dropout: 0.3
      recurrent_dropout: 0.0
      epochs: 5
      batch_size: 256
      validation_split: 0.1
    tags: [baseline, neural, sequence]

  - name: bigru
    description: Bidirectional character-level GRU sequence model.
    model_type: bigru
    features: [full_name]
    model_params:
      max_len: 32
      embedding_dim: 64
      gru_units: 32
      dropout: 0.3
      recurrent_dropout: 0.0
      epochs: 5
      batch_size: 256
      validation_split: 0.1
    tags: [baseline, neural, sequence]

  - name: transformer
    description: Compact Transformer encoder over full-name characters.
    model_type: transformer
    features: [full_name]
    model_params:
      max_len: 32
      embedding_dim: 64
      transformer_num_heads: 2
      transformer_head_size: 32
      transformer_ff_dim: 128
      dropout: 0.2
      epochs: 5
      batch_size: 256
      validation_split: 0.1
    tags: [baseline, neural, attention]

  - name: ensemble
    description: Soft-voting ensemble of linear, forest, and Naive Bayes learners.
    model_type: ensemble
    features: [full_name]
    model_params:
      base_models: [logistic_regression, random_forest, naive_bayes]
      voting: soft
      n_jobs: -1
    tags: [baseline, ensemble, character]

advanced_experiments: []
feature_studies: []
hyperparameter_tuning: []
