[project]
name = "ners"
version = "0.2.0"
description = "Comparative full-name sex classification study for the CongoNames corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.2",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "polars>=1.37.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "streamlit>=1.62.0",
    "tensorflow==2.20.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "typer>=0.19.2",
    "xgboost>=3.0.5",
]

[project.scripts]
ners = "ners.cli:app"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pyright>=1.1.406",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
useLibraryCodeForTypes = true
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 96
extend-exclude = ["**/*.ipynb"]
